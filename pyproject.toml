[project]
name = "hive-explorer"
version = "0.1.0"
description = "Parse and dump Flutter Hive (.hive) box files"
authors = [
    { name = "ojack69", email = "riccardo.palumbo69@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "rich>=15.0.0",
]

[project.scripts]
hive-explorer = "hive_explorer.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
